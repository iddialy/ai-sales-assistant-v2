/* =========================================================
   API
========================================================= */

async function api(path, opt = {}) {

  opt.headers = {

    ...(opt.headers || {}),

    "Content-Type":
      "application/json",

    ...(token
      ? {
          Authorization:
            "Bearer " + token
        }
      : {})
  };

  let r;
  try {
    r = await fetch(
      API_URL + path,
      opt
    );
  } catch (err) {
    throw Error(
      "Imeshindwa kuwasiliana na Server. Hakikisha internet ipo au subiri sekunde 30 Server ya Render iamke."
    );
  }

  let d = {};

  try {
    d = await r.json();
  } catch (_) {
    d = {
      detail:
        "Server haikurudisha jibu sahihi"
    };
  }

  if (!r.ok) {

    // Kazi ya kutoa maelezo sahihi ya error hata kama ni array au object
    let errorMsg = "Kuna tatizo";

    if (typeof d.detail === "string") {
      errorMsg = d.detail;
    } else if (Array.isArray(d.detail) && d.detail.length > 0) {
      errorMsg = d.detail[0].msg || "Taarifa ulizoweka hazijakamilika kikamilifu.";
    } else if (d.message) {
      errorMsg = d.message;
    }

    throw Error(errorMsg);

  }

  return d;
}

/* =========================================================
   LOGIN ACTION
========================================================= */

async function login() {

  const msg =
    document.getElementById(
      "authMsg"
    );

  const btn =
    document.getElementById(
      "loginBtn"
    );


  btn.disabled = true;

  btn.textContent =
    "Inaingia...";

  msg.textContent = "";


  try {

    const d =
      await api(
        "/auth/login",
        {
          method: "POST",

          body:
            JSON.stringify({

              email:
                document
                .getElementById(
                  "loginEmail"
                )
                .value
                .trim(),

              password:
                document
                .getElementById(
                  "loginPassword"
                )
                .value

            })
        }
      );


    token = d.token;


    localStorage.setItem(
      "salesai_token",
      token
    );


    await load();


  } catch (e) {

    msg.textContent =
      e.message;

    msg.className =
      "text-sm mt-3 text-red-600";


    btn.disabled = false;

    btn.textContent =
      "Login";
  }
}


/* =========================================================
   SIGNUP ACTION
========================================================= */

async function signup() {

  const msg =
    document.getElementById(
      "authMsg"
    );

  const btn =
    document.getElementById(
      "signupBtn"
    );

  const bizName = document.getElementById("signupBiz").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const phone = document.getElementById("signupPhone").value.trim();
  const password = document.getElementById("signupPassword").value;

  if (!bizName || !email || !phone || !password) {
    msg.textContent = "Tafadhali jaza sehemu zote zilizowekwa.";
    msg.className = "text-sm mt-3 text-red-600";
    return;
  }

  if (password.length < 8) {
    msg.textContent = "Password lazima iwe na angalau herufi 8.";
    msg.className = "text-sm mt-3 text-red-600";
    return;
  }

  btn.disabled = true;

  btn.textContent =
    "Inafungua account...";

  msg.textContent = "";


  try {

    const d =
      await api(
        "/auth/signup",
        {
          method: "POST",

          body:
            JSON.stringify({

              business_name: bizName,

              email: email,

              phone_number: phone,

              password: password,

              language_preference: "sw"

            })
        }
      );


    token = d.token;


    localStorage.setItem(
      "salesai_token",
      token
    );


    await load();


  } catch (e) {

    msg.textContent =
      e.message;

    msg.className =
      "text-sm mt-3 text-red-600 font-semibold";


    btn.disabled = false;

    btn.textContent =
      "Sign Up";
  }
}


/* =========================================================
   LOAD USER
========================================================= */

async function load() {

  try {

    me =
      await api(
        "/auth/me"
      );


    dashboard();


  } catch (e) {

    token = null;


    localStorage.removeItem(
      "salesai_token"
    );


    authScreen();
  }
}

    <div
      id="products">
    </div>

  </section>


  `;


  loadProducts();


  /*
    Enter sends message.
    Shift + Enter = new line.
  */

  const textarea =
    document.getElementById(
      "chatMessage"
    );


  textarea.addEventListener(
    "keydown",
    function(e) {

      if (
        e.key === "Enter" &&
        !e.shiftKey
      ) {

        e.preventDefault();

        sendChat();

      }

    }
  );

}

/* =========================================================
   SEND CHAT - REAL STREAMING
========================================================= */

async function sendChat() {

  const input =
    document.getElementById(
      "chatMessage"
    );


  const btn =
    document.getElementById(
      "chatBtn"
    );


  const message =
    input.value.trim();


  if (!message) {

    input.focus();

    return;

  }


  /*
    Show customer's message immediately.
  */

  addUserMessage(
    message
  );


  input.value = "";

  input.focus();


  btn.disabled = true;

  btn.textContent =
    "AI inaandika...";


  /*
    Prepare previous conversation.
  */

  const previousConversation =
    chatHistory
    .slice(-10)
    .map(item => {

      if (
        item.role === "user"
      ) {

        return (
          "MTEJA: " +
          item.content
        );

      }

      return (
        "AI: " +
        item.content
      );

    })
    .join("\n");


  let aiMessage =
    message;


  if (previousConversation) {

    aiMessage = `

HISTORIA YA MAZUNGUMZO:

${previousConversation}

---

SWALI JIPYA LA MTEJA:

${message}

Jibu swali jipya ukitumia historia hapo juu
pale inapohitajika. Usirudie historia yote.
`;
  }


  let aiBubble = null;

  let fullReply = "";


  try {

    const response =
      await fetch(
        API_URL + "/chat",
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            ...(token
              ? {
                  Authorization:
                    "Bearer " + token
                }
              : {})
          },

          body:
            JSON.stringify({

              message:
                aiMessage,

              platform:
                "web"

            })
        }
      );


    if (!response.ok) {

      let errorMessage =
        "Kuna tatizo kwenye server.";

      try {

        const errorData =
          await response.json();

        errorMessage =
          errorData.detail ||
          errorData.message ||
          errorMessage;

      } catch (_) {

        try {

          const text =
            await response.text();

          if (text) {

            errorMessage =
              text;

          }

        } catch (_) {}

      }

      throw new Error(
        errorMessage
      );

    }


    if (!response.body) {

      throw new Error(
        "Browser yako haiwezi kusoma AI streaming."
      );

    }


    aiBubble =
      createStreamingAIMessage();


    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    while (true) {

      const {
        done,
        value
      } =
        await reader.read();


      if (done) {

        break;

      }


      const chunk =
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      if (!chunk) {

        continue;

      }


      fullReply +=
        chunk;


      updateStreamingAIMessage(
        aiBubble,
        fullReply
      );

    }


    const finalChunk =
      decoder.decode();


    if (finalChunk) {

      fullReply +=
        finalChunk;


      updateStreamingAIMessage(
        aiBubble,
        fullReply
      );

    }


    if (fullReply.trim()) {

      chatHistory.push({

        role:
          "assistant",

        content:
          fullReply

      });

    }


    try {

      const latestMe =
        await api(
          "/auth/me"
        );

      me =
        latestMe;


      const messageCount =
        document.getElementById(
          "messageCount"
        );


      if (messageCount) {

        messageCount.textContent =
          me.messages_used || 0;

      }

    } catch (_) {}



  } catch (e) {

    if (aiBubble) {

      const errorText =
        fullReply
          ? (
              fullReply +
              "\n\n" +
              (
                e.message ||
                "Samahani, kuna tatizo."
              )
            )
          : (
              e.message ||
              "Samahani, kuna tatizo."
            );


      updateStreamingAIMessage(
        aiBubble,
        errorText
      );


      if (errorText.trim()) {

        chatHistory.push({

          role:
            "assistant",

          content:
            errorText

        });

      }

    } else {

      addAIMessage(
        e.message ||
        "Samahani, kuna tatizo."
      );

    }

  }


  btn.disabled = false;

  btn.textContent =
    "Uliza AI";


  input.focus();

}


/* =========================================================
   CREATE STREAMING AI MESSAGE
========================================================= */

function createStreamingAIMessage() {

  const container =
    document.getElementById(
      "chatHistory"
    );


  if (!container) {

    return null;

  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "flex justify-start";


  div.innerHTML = `

    <div class="max-w-[90%]">

      <div class="text-xs text-slate-500 mb-1">
        AI Sales Assistant
      </div>

      <div
        class="bg-slate-100 rounded-2xl rounded-tl-md p-4 whitespace-pre-wrap break-words"
        data-ai-stream="true">

      </div>

    </div>

  `;


  container.appendChild(
    div
  );


  scrollChatToBottom();


  return div;
}


/* =========================================================
   UPDATE STREAMING AI MESSAGE
========================================================= */

function updateStreamingAIMessage(
  bubble,
  message
) {

  if (!bubble) return;


  const content =
    bubble.querySelector(
      '[data-ai-stream="true"]'
    );


  if (!content) return;


  content.textContent =
    message;


  scrollChatToBottom();
}

/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct() {

  const btn =
    document.getElementById(
      "saveProductBtn"
    );


  const msg =
    document.getElementById(
      "productFormMsg"
    );


  const name =
    document
    .getElementById(
      "pname"
    )
    .value
    .trim();


  const category =
    document
    .getElementById(
      "pcategory"
    )
    .value
    .trim();


  const wholesaleValue =
    document
    .getElementById(
      "pwholesale"
    )
    .value;


  const retailValue =
    document
    .getElementById(
      "pretail"
    )
    .value;


  const stockValue =
    document
    .getElementById(
      "pstock"
    )
    .value;


  const status =
    document
    .getElementById(
      "pstatus"
    )
    .value;


  const desc =
    document
    .getElementById(
      "pdesc"
    )
    .value
    .trim();


  const image =
    document
    .getElementById(
      "pimage"
    )
    .value
    .trim();


  const wholesale =
    wholesaleValue === ""
      ? null
      : Number(wholesaleValue);


  const retail =
    Number(retailValue);


  const stock =
    Number(stockValue);


  if (!name) {

    msg.textContent =
      "Weka jina la bidhaa.";

    msg.className =
      "text-sm mt-4 text-red-600";

    return;

  }


  if (
    !Number.isFinite(retail) ||
    retail <= 0
  ) {

    msg.textContent =
      "Weka bei sahihi ya rejareja.";

    msg.className =
      "text-sm mt-4 text-red-600";

    return;

  }


  if (
    wholesale !== null &&
    (
      !Number.isFinite(wholesale) ||
      wholesale < 0
    )
  ) {

    msg.textContent =
      "Weka bei sahihi ya jumla.";

    msg.className =
      "text-sm mt-4 text-red-600";

    return;

  }


  if (
    !Number.isInteger(stock) ||
    stock < 0
  ) {

    msg.textContent =
      "Stock quantity lazima iwe namba 0 au zaidi.";

    msg.className =
      "text-sm mt-4 text-red-600";

    return;

  }


  btn.disabled = true;

  btn.textContent =
    editingProductId
      ? "Inasasisha..."
      : "Inahifadhi...";


  msg.textContent = "";


  /*
    Backend automatically changes
    status to IMEISHA when stock = 0.
  */

  const finalStatus =
    stock === 0
      ? "IMEISHA"
      : status;


  const payload = {

    product_name:
      name,

    category:
      category || null,

    description:
      desc,

    wholesale_price:
      wholesale,

    retail_price:
      retail,

    stock_quantity:
      stock,

    status:
      finalStatus,

    image_url:
      image || null

  };


  try {

    if (editingProductId) {

      await api(
        "/products/" +
        encodeURIComponent(
          editingProductId
        ),
        {
          method: "PUT",

          body:
            JSON.stringify(
              payload
            )
        }
      );


      msg.textContent =
        "✅ Bidhaa imesasishwa vizuri.";

    } else {

      await api(
        "/products",
        {
          method: "POST",

          body:
            JSON.stringify(
              payload
            )
        }
      );


      msg.textContent =
        "✅ Bidhaa imehifadhiwa vizuri.";

    }


    msg.className =
      "text-sm mt-4 text-green-600";


    resetProductForm();


    await loadProducts();


  } catch (e) {

    msg.textContent =
      e.message ||
      "Imeshindikana kuhifadhi bidhaa.";

    msg.className =
      "text-sm mt-4 text-red-600";


    btn.disabled = false;

    btn.textContent =
      editingProductId
        ? "Sasisha Bidhaa"
        : "Hifadhi Bidhaa";

  }

}

                <!-- PRICES -->

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">


                  <div class="border rounded-xl p-3">

                    <p class="text-xs text-slate-500">
                      Bei ya rejareja
                    </p>

                    <p class="text-green-700 font-bold mt-1">
                      ${money(p.retail_price)}
                    </p>

                  </div>


                  ${
                    p.wholesale_price !== null &&
                    p.wholesale_price !== undefined

                    ?

                    `
                    <div class="border rounded-xl p-3">

                      <p class="text-xs text-slate-500">
                        Bei ya jumla
                      </p>

                      <p class="text-blue-700 font-bold mt-1">
                        ${money(p.wholesale_price)}
                      </p>

                    </div>
                    `

                    :

                    `
                    <div class="border rounded-xl p-3">

                      <p class="text-xs text-slate-500">
                        Bei ya jumla
                      </p>

                      <p class="text-slate-400 font-semibold mt-1">
                        Haijawekwa
                      </p>

                    </div>
                    `

                  }

                </div>


                <!-- STOCK -->

                <div class="mt-3">

                  <div class="border rounded-xl p-3">

                    <div class="flex justify-between items-center">

                      <div>

                        <p class="text-xs text-slate-500">
                          Stock
                        </p>

                        <p class="font-bold mt-1">
                          ${Number(
                            p.stock_quantity || 0
                          )} units
                        </p>

                      </div>


                      <div class="text-sm">

                        ${
                          isOut

                          ?

                          `<span class="text-red-600 font-bold">
                            🔴 Hakuna stock
                          </span>`

                          :

                          `<span class="text-green-600 font-bold">
                            🟢 Inapatikana
                          </span>`

                        }

                      </div>

                    </div>

                  </div>

                </div>


                <!-- DESCRIPTION -->

                ${
                  p.description

                  ?

                  `
                  <div class="text-sm text-slate-600 mt-3 whitespace-pre-wrap">
                    ${escapeHtml(
                      p.description
                    )}
                  </div>
                  `

                  :

                  ""

                }


              </div>


            </div>

          </div>

          `;

        }
      ).join("");


  } catch (e) {

    const container =
      document.getElementById(
        "products"
      );


    if (container) {

      container.innerHTML = `

        <div class="border border-red-200 bg-red-50 text-red-700 rounded-xl p-4 mt-4">

          Imeshindikana kupakia bidhaa.

        </div>

      `;

    }

  }

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(s) {

  return String(
    s ?? ""
  ).replace(
    /[&<>'"]/g,

    c => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      "'":
        "&#39;",

      '"':
        "&quot;"

    }[c])
  );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

  localStorage.removeItem(
    "salesai_token"
  );


  token = null;

  me = null;

  chatHistory = [];

  editingProductId = null;


  location.reload();
}


/* =========================================================
   START APP
========================================================= */

if (token) {

  load();

} else {

  authScreen();

}

</script>

</body>
</html>
