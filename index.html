<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SalesAI Tanzania</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
<nav class="bg-blue-950 text-white p-4 flex justify-between items-center gap-3">
  <b class="text-xl">SalesAI <span class="text-xs bg-green-500 px-2 py-1 rounded">Tanzania</span></b>
  <div id="navActions"></div>
</nav>
<main class="max-w-6xl mx-auto p-4 md:p-8" id="app"></main>

<script>
const API_URL="https://ai-sales-assistant-api-07y0.onrender.com";
let token=localStorage.getItem('salesai_token');
let me=null;
const money=n=>new Intl.NumberFormat('sw-TZ').format(n)+' TSH';

async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};
  const r=await fetch(API_URL+path,opt);
  let d={}; try{d=await r.json()}catch(_){d={detail:'Server haikurudisha jibu sahihi'}}
  if(!r.ok) throw Error(d.detail||d.message||'Kuna tatizo');
  return d;
}

function authScreen(){
  document.getElementById('navActions').innerHTML='';
  document.getElementById('app').innerHTML=`
  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow">
    <div class="flex gap-2 mb-6">
      <button id="loginTab" class="flex-1 bg-blue-900 text-white p-2 rounded-xl">Login</button>
      <button id="signupTab" class="flex-1 border p-2 rounded-xl">Sign Up</button>
    </div>
    <div id="authForm"></div>
  </div>`;
  showLogin();
}

function showLogin(){
  document.getElementById('authForm').innerHTML=`
    <h1 class="text-2xl font-bold mb-2">Karibu tena</h1>
    <p class="text-sm text-slate-500 mb-4">Ingia kwenye akaunti ya biashara yako.</p>
    <input id="loginEmail" type="email" autocomplete="email" placeholder="Email" class="w-full border p-3 rounded-xl mb-3">
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" class="w-full border p-3 rounded-xl mb-4">
    <button id="loginBtn" onclick="login()" class="w-full bg-blue-900 text-white p-3 rounded-xl font-bold">Login</button>
    <p id="authMsg" class="text-sm mt-3"></p>`;
  document.getElementById('loginTab').onclick=showLogin;
  document.getElementById('signupTab').onclick=showSignup;
}

function showSignup(){
  document.getElementById('authForm').innerHTML=`
    <h1 class="text-2xl font-bold mb-2">Fungua akaunti</h1>
    <p class="text-sm text-slate-500 mb-4">Anza kuuza 24/7 kwa AI.</p>
    <input id="signupBiz" placeholder="Jina la biashara" class="w-full border p-3 rounded-xl mb-3">
    <input id="signupEmail" type="email" autocomplete="email" placeholder="Email" class="w-full border p-3 rounded-xl mb-3">
    <input id="signupPhone" inputmode="tel" placeholder="07XXXXXXXX" class="w-full border p-3 rounded-xl mb-3">
    <input id="signupPassword" type="password" autocomplete="new-password" placeholder="Password (angalau herufi 8)" class="w-full border p-3 rounded-xl mb-4">
    <button id="signupBtn" onclick="signup()" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Sign Up</button>
    <p id="authMsg" class="text-sm mt-3"></p>`;
  document.getElementById('loginTab').onclick=showLogin;
  document.getElementById('signupTab').onclick=showSignup;
}

async function login(){
  const msg=document.getElementById('authMsg');
  const btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='Inaingia...'; msg.textContent='';
  try{
    const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value})});
    token=d.token; localStorage.setItem('salesai_token',token); await load();
  }catch(e){msg.textContent=e.message;msg.className='text-sm mt-3 text-red-600';btn.disabled=false;btn.textContent='Login';}
}

async function signup(){
  const msg=document.getElementById('authMsg');
  const btn=document.getElementById('signupBtn');
  btn.disabled=true; btn.textContent='Inafungua account...'; msg.textContent='';
  try{
    const d=await api('/auth/signup',{method:'POST',body:JSON.stringify({
      business_name:document.getElementById('signupBiz').value.trim(),
      email:document.getElementById('signupEmail').value.trim(),
      phone_number:document.getElementById('signupPhone').value.trim(),
      password:document.getElementById('signupPassword').value
    })});
    token=d.token; localStorage.setItem('salesai_token',token); await load();
  }catch(e){msg.textContent=e.message;msg.className='text-sm mt-3 text-red-600';btn.disabled=false;btn.textContent='Sign Up';}
}

async function load(){
  try{me=await api('/auth/me');dashboard();}
  catch(e){token=null;localStorage.removeItem('salesai_token');authScreen();}
}

function dashboard(){
  document.getElementById('navActions').innerHTML=`<button onclick="logout()" class="bg-white/10 px-3 py-2 rounded-xl">Logout</button>`;
  document.getElementById('app').innerHTML=`
  <div class="mb-6"><h1 class="text-3xl font-bold">Karibu, ${escapeHtml(me.business_name)}</h1><p class="text-slate-500">AI Sales Assistant iko tayari kwa majaribio.</p></div>
  <div class="grid md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white p-5 rounded-xl shadow"><p class="text-sm text-slate-500">Account</p><b class="text-xl text-green-600">Active</b></div>
    <div class="bg-white p-5 rounded-xl shadow"><p class="text-sm text-slate-500">Bidhaa</p><b id="productCount" class="text-xl">...</b></div>
    <div class="bg-white p-5 rounded-xl shadow"><p class="text-sm text-slate-500">Messages</p><b class="text-xl">${me.messages_used||0}</b></div>
  </div>
  <section class="bg-white p-6 rounded-2xl shadow mb-6">
    <h2 class="text-xl font-bold mb-2">Jaribu AI Sales Assistant</h2>
    <p class="text-sm text-slate-500 mb-4">Kwa sasa mfumo wa malipo umeondolewa. Unaweza kujaribu AI bila kulipia.</p>
    <textarea id="chatMessage" rows="3" placeholder="Mfano: Bei ya bidhaa hii ni kiasi gani?" class="w-full border p-3 rounded-xl mb-3"></textarea>
    <button onclick="sendChat()" id="chatBtn" class="w-full bg-blue-900 text-white p-3 rounded-xl font-bold">Uliza AI</button>
    <div id="chatReply" class="mt-4 whitespace-pre-wrap"></div>
  </section>
  <section class="bg-white p-6 rounded-2xl shadow">
    <h2 class="text-xl font-bold mb-4">Product Catalog</h2>
    <div class="grid md:grid-cols-3 gap-3"><input id="pname" placeholder="Jina la bidhaa" class="border p-3 rounded-xl"><input id="pprice" type="number" placeholder="Bei TSH" class="border p-3 rounded-xl"><input id="pdesc" placeholder="Maelezo" class="border p-3 rounded-xl"><button onclick="addProduct()" class="md:col-span-3 bg-blue-900 text-white p-3 rounded-xl font-bold">Hifadhi Bidhaa</button></div>
    <div id="products" class="mt-5"></div>
  </section>`;
  loadProducts();
}

async function sendChat(){
  const input=document.getElementById('chatMessage');
  const btn=document.getElementById('chatBtn');
  const reply=document.getElementById('chatReply');
  const message=input.value.trim();
  if(!message){reply.textContent='Andika swali kwanza.';return;}
  btn.disabled=true; btn.textContent='AI inajibu...'; reply.textContent='';
  try{
    const d=await api('/chat',{method:'POST',body:JSON.stringify({message,platform:'web'})});
    reply.innerHTML='<div class="bg-slate-100 rounded-xl p-4">'+escapeHtml(d.ai_reply)+'</div>';
    me.messages_used=d.messages_used||me.messages_used;
  }catch(e){reply.textContent=e.message; reply.className='mt-4 text-red-600';}
  btn.disabled=false; btn.textContent='Uliza AI';
}

async function addProduct(){
  try{await api('/products',{method:'POST',body:JSON.stringify({product_name:document.getElementById('pname').value,price:Number(document.getElementById('pprice').value),description:document.getElementById('pdesc').value})});document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pdesc').value='';loadProducts();}catch(e){alert(e.message)}
}
async function loadProducts(){
  try{const ps=await api('/products');document.getElementById('productCount').textContent=ps.length;document.getElementById('products').innerHTML=ps.length?ps.map(p=>`<div class="border p-3 rounded-xl mt-2"><b>${escapeHtml(p.product_name)}</b> — ${money(p.price)}<div class="text-sm text-slate-500">${escapeHtml(p.description)}</div></div>`).join(''):'<p class="text-slate-500">Bado hujaweka bidhaa.</p>';}catch(_){ }
}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function logout(){localStorage.removeItem('salesai_token');token=null;location.reload();}
if(token)load();else authScreen();
</script>
</body>
</html>
