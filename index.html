/* =========================================================
   API
========================================================= */

async function api(path, opt = {}) {

  opt.headers = {

    ...(opt.headers || {}),

    "Content-Type":
      "application/json",

    ...(token
      ? {
          Authorization:
            "Bearer " + token
        }
      : {})
  };


  const r =
    await fetch(
      API_URL + path,
      opt
    );


  let d = {};


  try {

    d = await r.json();

  } catch (_) {

    d = {
      detail:
        "Server haikurudisha jibu sahihi"
    };

  }


  if (!r.ok) {

    throw Error(
      d.detail ||
      d.message ||
      "Kuna tatizo"
    );

  }


  return d;
}

/* =========================================================
   LOGIN ACTION
========================================================= */

async function login() {

  const msg =
    document.getElementById(
      "authMsg"
    );

  const btn =
    document.getElementById(
      "loginBtn"
    );


  btn.disabled = true;

  btn.textContent =
    "Inaingia...";

  msg.textContent = "";


  try {

    const d =
      await api(
        "/auth/login",
        {
          method: "POST",

          body:
            JSON.stringify({

              email:
                document
                .getElementById(
                  "loginEmail"
                )
                .value
                .trim(),

              password:
                document
                .getElementById(
                  "loginPassword"
                )
                .value

            })
        }
      );


    token = d.token;


    localStorage.setItem(
      "salesai_token",
      token
    );


    await load();


  } catch (e) {

    msg.textContent =
      e.message;

    msg.className =
      "text-sm mt-3 text-red-600";


    btn.disabled = false;

    btn.textContent =
      "Login";
  }
}

    "profileBusinessName"

  document.getElementById(
    "profileLocation"
  ).value =
    me.business_location || "";


  document.getElementById(
    "profileType"
  ).value =
    me.business_type || "";


  document.getElementById(
    "profileHours"
  ).value =
    me.business_hours || "";


  document.getElementById(
    "profileDescription"
  ).value =
    me.business_description || "";


  document.getElementById(
    "profileLipaNamba"
  ).value =
    me.payment_info?.lipa_namba || "";


  document.getElementById(
    "profilePhonePayment"
  ).value =
    me.payment_info?.phone_payment || "";


  document.getElementById(
    "profileBank"

    me.payment_info?.bank_account || "";


  document.getElementById(

  section.classList.remove(

  section.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}

/* =========================================================

========================================================= */

async function saveProfile() {

    );

  btn.textContent =
    "Inahifadhi...";

  msg.textContent = "";


  try {

    const d =
      await api(
        "/business-profile",
        {
          method: "PUT",

          body:
            JSON.stringify({

              business_name:
                document
                .getElementById(
                  "profileBusinessName"
                )
                .value
                .trim(),

              phone_number:
                document
                .getElementById(
                  "profilePhone"
                )
                .value
                .trim(),

              business_location:
                document
                .getElementById(
                  "profileLocation"
                )
                .value
                .trim() || null,

              business_type:
                document
                .getElementById(
                  "profileType"
                )
                .value
                .trim() || null,

              business_hours:
                document
                .getElementById(
                  "profileHours"
                )
                .value
                .trim() || null,

              business_description:
                document
                .getElementById(
                  "profileDescription"
                )
                .value
                .trim() || null,

              lipa_namba:
                document
                .getElementById(
                  "profileLipaNamba"
                )
                .value
                .trim() || null,

              phone_payment:
                document
                .getElementById(
                  "profilePhonePayment"
                )
                .value
                .trim() || null,

              bank_account:
                document
                .getElementById(
                  "profileBank"
                )
                .value
                .trim() || null

            })
        }
      );


    me =
      d.merchant;


    msg.textContent =
      "✅ Business Profile imehifadhiwa vizuri.";

    msg.className =
      "text-sm mt-4 text-green-600";


    btn.disabled = false;

    btn.textContent =
      "Hifadhi Profile";


    /*
      Refresh dashboard
      ili taarifa mpya zionekane.
    */

    setTimeout(
      () => {

        dashboard();

      },
      700
    );


  } catch (e) {

    msg.textContent =
      e.message ||
      "Imeshindikana kuhifadhi.";

    msg.className =
      "text-sm mt-4 text-red-600";


    btn.disabled = false;

    btn.textContent =
      "Hifadhi Profile";
  }

}


/* =========================================================
   SEND CHAT
========================================================= */

async function sendChat() {

  const input =
    document.getElementById(
      "chatMessage"
    );


  const btn =
    document.getElementById(
      "chatBtn"
    );


  const message =
    input.value.trim();


  if (!message) {

    input.focus();

    return;

  }


  addUserMessage(
    message
  );


  input.value = "";

  input.focus();


  btn.disabled = true;

  btn.textContent =
    "AI inajibu...";


  const previousConversation =
    chatHistory
    .slice(-10)
    .map(item => {

      if (
        item.role === "user"
      ) {

        return (
          "MTEJA: " +
          item.content
        );

      }

      return (
        "AI: " +
        item.content
      );

    })
    .join("\n");


  let aiMessage =
    message;


  if (previousConversation) {

    aiMessage = `

HISTORIA YA MAZUNGUMZO:

${previousConversation}

---

SWALI JIPYA LA MTEJA:

${message}

Jibu swali jipya ukitumia historia hapo juu
pale inapohitajika. Usirudie historia yote.
`;
  }


  try {

    const d =
      await api(
        "/chat",
        {
          method: "POST",

          body:
            JSON.stringify({

              message:
                aiMessage,

              platform:
                "web"

            })
        }
      );


    const reply =
      d.ai_reply ||
      "Samahani, AI haikupata jibu kwa sasa.";


    addAIMessage(
      reply
    );


    me.messages_used =
      d.messages_used ||
      me.messages_used;


  } catch (e) {

    addAIMessage(
      e.message ||
      "Samahani, kuna tatizo."
    );

  }


  btn.disabled = false;

  btn.textContent =
    "Uliza AI";


  input.focus();
}


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(
  message
) {

  chatHistory.push({

    role: "user",

    content: message

  });


  const container =
    document.getElementById(
      "chatHistory"
    );


  if (!container) return;


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "flex justify-end";


  div.innerHTML = `

    <div class="max-w-[85%]">

      <div class="text-xs text-slate-500 mb-1 text-right">
        Wewe
      </div>

      <div class="bg-blue-900 text-white rounded-2xl rounded-tr-md p-4 whitespace-pre-wrap">

        ${escapeHtml(message)}

      </div>

    </div>

  `;


  container.appendChild(
    div
  );


  scrollChatToBottom();
}


/* =========================================================
   ADD AI MESSAGE
========================================================= */

function addAIMessage(
  message
) {

  chatHistory.push({

    role: "assistant",

    content: message

  });


  const container =
    document.getElementById(
      "chatHistory"
    );


  if (!container) return;


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "flex justify-start";


  div.innerHTML = `

    <div class="max-w-[90%]">

      <div class="text-xs text-slate-500 mb-1">
        AI Sales Assistant
      </div>

      <div class="bg-slate-100 rounded-2xl rounded-tl-md p-4 whitespace-pre-wrap">

        ${escapeHtml(message)}

      </div>

    </div>

  `;


  container.appendChild(
    div
  );


  scrollChatToBottom();
}


/* =========================================================
   CHAT SCROLL
========================================================= */

function scrollChatToBottom() {

  setTimeout(
    () => {

      window.scrollTo({

        top:
          document.body.scrollHeight,

        behavior:
          "smooth"

      });

    },
    100
  );
}


/* =========================================================
   CLEAR CHAT
========================================================= */

function clearChat() {

  if (
    chatHistory.length === 0
  ) {

    return;

  }


  const confirmed =
    confirm(
      "Una uhakika unataka kufuta mazungumzo haya?"
    );


  if (!confirmed) {

    return;

  }


  chatHistory = [];


  const container =
    document.getElementById(
      "chatHistory"
    );


  if (container) {

    container.innerHTML = "";

  }


  const input =
    document.getElementById(
      "chatMessage"
    );


  if (input) {

    input.value = "";

    input.focus();

  }

}


/* =========================================================
   ADD PRODUCT
========================================================= */

async function addProduct() {

  const name =
    document
    .getElementById(
      "pname"
    )
    .value
    .trim();


  const price =
    Number(
      document
      .getElementById(
        "pprice"
      )
      .value
    );


  const desc =
    document
    .getElementById(
      "pdesc"
    )
    .value
    .trim();


  const image =
    document
    .getElementById(
      "pimage"
    )
    .value
    .trim();


  if (!name) {

    alert(
      "Weka jina la bidhaa."
    );

    return;

  }


  if (!price || price <= 0) {

    alert(
      "Weka bei sahihi."
    );

    return;

  }


  try {

    await api(
      "/products",
      {
        method: "POST",

        body:
          JSON.stringify({

            product_name:
              name,

            price:
              price,

            description:
              desc,

            image_url:
              image || null

          })
      }
    );


    document.getElementById(
      "pname"
    ).value = "";


    document.getElementById(
      "pprice"
    ).value = "";


    document.getElementById(
      "pdesc"
    ).value = "";


    document.getElementById(
      "pimage"
    ).value = "";


    loadProducts();


  } catch (e) {

    alert(
      e.message
    );

  }

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

  try {

    const ps =
      await api(
        "/products"
      );


    const count =
      document.getElementById(
        "productCount"
      );


    if (count) {

      count.textContent =
        ps.length;

    }


    const container =
      document.getElementById(
        "products"
      );


    if (!container) return;


    container.innerHTML =
      ps.length

      ?

      ps.map(
        p => `

        <div class="border rounded-2xl p-4 mt-3">

          ${
            p.image_url

            ?

            `
            <img
              src="${escapeHtml(p.image_url)}"
              alt="${escapeHtml(p.product_name)}"
              class="w-full h-48 object-cover rounded-xl mb-3"
              loading="lazy"
              onerror="this.style.display='none'">
            `

            :

            ""
          }


          <div class="flex justify-between gap-3">

            <div>

              <b class="text-lg">
                ${escapeHtml(
                  p.product_name
                )}
              </b>


              <div class="text-green-700 font-bold mt-1">
                ${money(p.price)}
              </div>

            </div>

          </div>


          <div class="text-sm text-slate-500 mt-2">
            ${escapeHtml(
              p.description
            )}
          </div>


        </div>

      `
      ).join("")

      :

      `
      <div class="text-center py-6">

        <p class="text-slate-500">
          Bado hujaweka bidhaa.
        </p>

        <p class="text-xs text-slate-400 mt-1">
          Ongeza bidhaa hapo juu ili AI iweze kuzitumia.
        </p>

      </div>
      `;


  } catch (_) {

  }

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(s) {

  return String(
    s ?? ""
  ).replace(
    /[&<>'"]/g,

    c => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      "'":
        "&#39;",

      '"':
        "&quot;"

    }[c])
  );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

  localStorage.removeItem(
    "salesai_token"
  );


  token = null;

  me = null;

  chatHistory = [];


  location.reload();
}


/* =========================================================
   START APP
========================================================= */

if (token) {

  load();

} else {

  authScreen();

}
